<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchkeeper">
<title>Watchkeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed header + filter strip, scrolling list, fixed mic dock. */
:root{
  --bg:#f5f3ee;
  --surface:#ffffff;
  --surface-2:#eeebe3;
  --ink:#16202b;
  --ink-2:#5a6672;
  --ink-3:#8a949e;
  --line:#ddd8cd;
  --navy:#0e1b2a;
  --amber:#e08a1e;
  --amber-soft:#fbead2;
  --green:#14795c;
  --red:#b23b2e;
  --radius:14px;
  --font-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1420; --surface:#121f2e; --surface-2:#19293a;
    --ink:#eef2f6; --ink-2:#a3b1bf; --ink-3:#74838f; --line:#223243;
    --navy:#081220; --amber:#f2a53c; --amber-soft:#2d2112;
    --green:#3fbf96; --red:#e2705f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1420; --surface:#121f2e; --surface-2:#19293a;
  --ink:#eef2f6; --ink-2:#a3b1bf; --ink-3:#74838f; --line:#223243;
  --navy:#081220; --amber:#f2a53c; --amber-soft:#2d2112;
  --green:#3fbf96; --red:#e2705f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overscroll-behavior-y:contain;
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- header ---------- */
header{
  background:var(--navy); color:#f3f1ec;
  padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:12px;
  padding-left:max(18px, env(safe-area-inset-left,0px));
  padding-right:max(18px, env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.brand h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.brand .sub{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:#8fa3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.hdr-btn{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  border-radius:10px; width:38px; height:38px; display:grid; place-items:center;
  color:#e8edf2; flex:0 0 auto; position:relative;
}
.hdr-btn:hover{background:rgba(255,255,255,.14)}
.hdr-btn svg{width:17px;height:17px}
.hdr-btn .dot{
  position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%;
  background:var(--amber); display:none;
}
.hdr-btn.warn .dot{display:block}

/* ---------- search ---------- */
.searchbar{
  display:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:9px max(18px, env(safe-area-inset-left,0px)) 9px max(18px, env(safe-area-inset-right,0px));
}
.searchbar.on{display:block}
.searchbar input{
  width:100%; padding:10px 12px; font:inherit; font-size:16px; border-radius:10px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
}

/* ---------- filters ---------- */
.filters{
  display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:9px max(18px, env(safe-area-inset-left,0px)) 9px max(18px, env(safe-area-inset-right,0px));
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:1px solid var(--line); background:transparent;
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600;
  color:var(--ink-2); display:flex; align-items:center; gap:6px;
}
.chip .n{font-family:var(--font-mono); font-size:11px; color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--bg); opacity:.7}

/* ---------- banner ---------- */
.banner{
  display:none; align-items:center; gap:10px;
  background:var(--amber-soft); color:var(--amber); border-bottom:1px solid var(--line);
  padding:10px max(18px, env(safe-area-inset-left,0px)) 10px max(18px, env(safe-area-inset-right,0px));
  font-size:12.5px; font-weight:600;
}
.banner.on{display:flex}
.banner button{
  margin-left:auto; background:var(--amber); color:#14202c; border:none;
  border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700; flex:0 0 auto;
}

/* ---------- list ---------- */
main{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px max(18px, env(safe-area-inset-left,0px)) 180px max(18px, env(safe-area-inset-right,0px));
}
.group-label{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
  margin:18px 0 8px; display:flex; align-items:center; gap:9px;
}
.group-label:first-child{margin-top:0}
.group-label::after{content:""; flex:1; height:1px; background:var(--line)}
.group-label.urgent{color:var(--red)}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 13px; display:grid; grid-template-columns:auto 1fr auto; gap:11px;
  align-items:start; margin-bottom:9px; border-left:3px solid var(--line);
}
.card.k-meeting{border-left-color:#2f6fb5}
.card.k-followup{border-left-color:var(--amber)}
.card.k-call{border-left-color:#7a56b8}
.card.k-task{border-left-color:var(--ink-3)}
.card.overdue{border-left-color:var(--red)}
.card.done{opacity:.52}
.card.done .title{text-decoration:line-through}
.card.hi{box-shadow:inset 3px 0 0 var(--red)}

.tick{
  width:23px;height:23px;border-radius:50%;border:2px solid var(--line);
  background:transparent; padding:0; flex:0 0 auto; margin-top:1px; display:grid; place-items:center;
}
.tick svg{width:12px;height:12px;opacity:0;color:var(--surface)}
.card.done .tick{background:var(--green); border-color:var(--green)}
.card.done .tick svg{opacity:1}

.body{min-width:0}
.title{font-size:15.5px; font-weight:600; line-height:1.3; margin:0 0 4px; overflow-wrap:anywhere}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
.when{font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--ink-2); font-variant-numeric:tabular-nums}
.card.overdue .when{color:var(--red); font-weight:600}
.tag{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:2px 6px; border-radius:4px; background:var(--surface-2); color:var(--ink-2);
}
.tag.rep{background:var(--amber-soft); color:var(--amber)}
.tag.tz{background:transparent; border:1px solid var(--line)}
.tag.pri{background:var(--red); color:#fff}
.sub2{font-size:12px; color:var(--ink-3); margin-top:4px; overflow-wrap:anywhere}
.heard{font-size:12px; color:var(--ink-3); margin-top:5px; font-style:italic; display:none; overflow-wrap:anywhere}
.card.expanded .heard{display:block}

.rowacts{display:flex; gap:4px; flex-direction:column; align-items:flex-end}
.iact{background:transparent; border:none; padding:5px; border-radius:7px; color:var(--ink-3); display:grid; place-items:center}
.iact:hover{background:var(--surface-2); color:var(--ink)}
.iact svg{width:16px;height:16px}

.tray{grid-column:1/-1; display:none; gap:6px; flex-wrap:wrap; padding-top:10px; border-top:1px dashed var(--line); margin-top:2px}
.card.expanded .tray{display:flex}
.sbtn{
  border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  padding:5px 10px; font-size:12px; font-weight:600; color:var(--ink-2); font-family:var(--font-mono);
}
.sbtn:hover{border-color:var(--ink-3); color:var(--ink)}
.sbtn.edit{background:var(--amber-soft); color:var(--amber); border-color:transparent}
.sbtn.del{color:var(--red)}

.empty{text-align:center; padding:44px 20px; color:var(--ink-3)}
.empty svg{width:40px;height:40px;opacity:.35;margin-bottom:12px}
.empty p{margin:0 0 6px; font-size:14.5px}
.empty .eg{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); line-height:1.9}

/* ---------- dock ---------- */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:linear-gradient(to top, var(--bg) 58%, transparent);
  padding:26px max(18px, env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; align-items:center; gap:9px;
}
.transcript{
  width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; font-size:14px; color:var(--ink-2); display:none;
}
.transcript.on{display:block}
.transcript .live{color:var(--ink); font-weight:500}
.transcript .parsed{font-family:var(--font-mono); font-size:11.5px; color:var(--amber); margin-top:6px}
.microw{display:flex; align-items:center; gap:14px; width:100%; max-width:560px; justify-content:center}
.mic{
  width:72px;height:72px;border-radius:50%; border:none; flex:0 0 auto;
  background:var(--navy); color:#fff; display:grid; place-items:center;
  box-shadow:0 6px 20px rgba(14,27,42,.3); transition:transform .12s ease, background .2s ease;
}
.mic:active{transform:scale(.94)}
.mic svg{width:30px;height:30px}
.mic.listening{background:var(--red); animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent)}50%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}
.mic:disabled{opacity:.4}
.typebtn{
  width:46px;height:46px;border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--ink-2);
}
.typebtn svg{width:19px;height:19px}
.typebtn.on{background:var(--amber); color:#14202c; border-color:transparent}
.hint{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); text-align:center}
.langbtn{background:none;border:none;padding:0 2px;font:inherit;color:var(--amber);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- dialogs ---------- */
.sheet{position:fixed; inset:0; z-index:50; background:rgba(8,16,26,.55); display:none; align-items:flex-end; justify-content:center}
.sheet.on{display:flex}
.sheet-inner{
  background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; border:1px solid var(--line); border-bottom:none;
  padding:16px max(18px, env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:12px;
}
.sheet h2{margin:0; font-size:17px; font-weight:700}
.sheet .lead{margin:0; font-size:13px; color:var(--ink-2)}
.fld{display:flex; flex-direction:column; gap:5px}
.fld label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.fld input, .fld select, .fld textarea{
  width:100%; padding:11px; font:inherit; font-size:16px; border-radius:10px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
}
.fld textarea{min-height:64px; resize:vertical}
.fld.flag input, .fld.flag select{border-color:var(--amber); background:var(--amber-soft)}
.fld .note{font-size:11.5px; color:var(--amber); font-weight:600}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.assume{
  background:var(--amber-soft); color:var(--amber); border-radius:10px; padding:10px 12px;
  font-size:12.5px; font-weight:600; display:none;
}
.assume.on{display:block}
.errbox{
  background:color-mix(in srgb, var(--red) 12%, var(--surface)); color:var(--red);
  border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:600; display:none;
}
.errbox.on{display:block}
.ambig{display:none; gap:8px; flex-wrap:wrap}
.ambig.on{display:flex}
.ambig button{
  flex:1 1 110px; padding:10px; border-radius:10px; border:1px solid var(--amber);
  background:transparent; color:var(--amber); font-weight:700; font-family:var(--font-mono);
}
.ambig button[aria-pressed="true"]{background:var(--amber); color:#14202c}
.sheet-row{display:flex; gap:9px; padding-top:2px}
.pbtn{flex:1; padding:13px; border-radius:11px; border:none; font-weight:700; font-size:15px; background:var(--navy); color:#fff}
.pbtn.ghost{background:var(--surface-2); color:var(--ink-2)}
.pbtn:disabled{opacity:.45}
.menu-item{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  padding:12px 13px; font-size:14.5px; font-weight:600;
}
.menu-item small{display:block; font-weight:400; font-size:12px; color:var(--ink-3); margin-top:2px}
.menu-item span{min-width:0}
.status-row{display:flex; align-items:flex-start; gap:9px; font-size:13px; padding:9px 0; border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.dotn{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px;background:var(--ink-3)}
.dotn.good{background:var(--green)}
.dotn.bad{background:var(--red)}
.dotn.warn{background:var(--amber)}
.status-row b{display:block; font-weight:600}
.status-row em{font-style:normal; color:var(--ink-3); font-size:12px}
.plain{font-size:12.5px; color:var(--ink-2); line-height:1.6; margin:0}
.plain strong{color:var(--ink)}

/* ---------- alarm ---------- */
.alarm{
  position:fixed; inset:0; z-index:90; display:none;
  background:var(--navy); color:#f4f1ec; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; text-align:center;
  padding:calc(26px + env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(24px, env(safe-area-inset-right,0px));
}
.alarm.on{display:flex}
.alarm .ring{width:80px;height:80px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;animation:shake 1.1s ease-in-out infinite}
.alarm .ring svg{width:38px;height:38px}
@keyframes shake{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion: reduce){.alarm .ring{animation:none}}
.alarm .kind{font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--amber)}
.alarm .what{font-size:25px; font-weight:700; line-height:1.25; max-width:18ch; text-wrap:balance; margin:0; overflow-wrap:anywhere}
.alarm .at{font-family:var(--font-mono); font-size:13px; color:#8fa3b8}
.alarm .acts{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; max-width:400px}
.abtn{flex:1 1 120px; padding:14px 16px; border-radius:12px; border:none; font-size:15px; font-weight:700; background:rgba(255,255,255,.12); color:#f4f1ec}
.abtn.main{background:var(--amber); color:#14202c}
.alarm .more{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.alarm .more button{background:none; border:1px solid rgba(255,255,255,.22); color:#b9c6d3; border-radius:999px; padding:7px 13px; font-family:var(--font-mono); font-size:12px}
.alarm .queued{font-family:var(--font-mono); font-size:11px; color:#6f8395; letter-spacing:.1em; text-transform:uppercase}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(174px + env(safe-area-inset-bottom,0px)); z-index:60;
  background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:999px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s;
  max-width:88vw; display:flex; align-items:center; gap:12px;
}
.toast.on{opacity:1; pointer-events:auto}
.toast button{background:none; border:none; color:var(--amber); font-weight:700; padding:0; text-decoration:underline}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Watchkeeper</h1>
    <div class="sub" id="subline">Voice reminders</div>
  </div>
  <button class="hdr-btn" id="bellBtn" aria-label="Alerts and test alarm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </button>
  <button class="hdr-btn" id="searchBtn" aria-label="Search reminders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <button class="hdr-btn" id="menuBtn" aria-label="Settings, status and backup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span class="dot"></span>
  </button>
</header>

<div class="searchbar" id="searchbar">
  <label class="sr" for="searchInput">Search reminders</label>
  <input type="search" id="searchInput" placeholder="Search title, vessel, reference or notes" autocomplete="off">
</div>

<nav class="filters" id="filters" aria-label="Filter reminders">
  <button class="chip" data-f="open" aria-pressed="true">Open <span class="n" id="c-open">0</span></button>
  <button class="chip" data-f="today" aria-pressed="false">Today <span class="n" id="c-today">0</span></button>
  <button class="chip" data-f="week" aria-pressed="false">7 days <span class="n" id="c-week">0</span></button>
  <button class="chip" data-f="high" aria-pressed="false">Priority <span class="n" id="c-high">0</span></button>
  <button class="chip" data-f="done" aria-pressed="false">Done <span class="n" id="c-done">0</span></button>
  <button class="chip" data-f="all" aria-pressed="false">All <span class="n" id="c-all">0</span></button>
</nav>

<div class="banner" id="banner" role="status">
  <span id="bannerText"></span>
  <button id="bannerAct">Fix</button>
</div>

<main id="list" aria-live="polite"></main>

<div class="dock">
  <div class="transcript" id="transcript" aria-live="polite"></div>
  <div class="microw">
    <button class="typebtn" id="typeBtn" aria-label="Type a reminder instead of speaking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="mic" id="micBtn" aria-label="Speak a reminder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    </button>
    <button class="typebtn" id="handsBtn" aria-label="Hands-free listening" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M3 12v3a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2Z"/><path d="M21 12v3a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2Z"/><path d="M18 17v1a3 3 0 0 1-3 3h-3"/></svg>
    </button>
  </div>
  <div class="hint"><span id="hint">Tap mic and speak</span> · <button class="langbtn" id="langBtn" aria-label="Change speech recognition accent">en-SG</button></div>
</div>

<!-- ============ confirm / edit dialog ============ -->

<script>
'use strict';

/* ============================== state ============================== */
let items = [];
let filter = 'open';
let query = '';
let saveBroken = false;
let lastDeleted = null;
let pendingDraft = null;      // draft awaiting confirmation
let editingId = null;         // id being edited, or null for a new one

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  if(raw == null){
    try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){}
  }
  let parsed = [];
  try{ parsed = raw ? JSON.parse(raw) : []; }catch(e){ parsed = []; }
  items = migrate(parsed);
}

/* Never silently lose data: a failed write raises a visible banner. */
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(items));
    if(saveBroken){ saveBroken = false; hideBanner(); }
    return true;
  }catch(e){
    saveBroken = true;
    showBanner('Could not save — storage is full or blocked. Save a backup now.', 'Backup', () => doBackup());
    return false;
  }
}

/* ============================== banner ============================== */
const bannerEl = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');
const bannerAct = document.getElementById('bannerAct');
let bannerHandler = null;
function showBanner(text, label, fn){
  bannerText.textContent = text;
  bannerAct.textContent = label || 'Fix';
  bannerAct.hidden = !fn;
  bannerHandler = fn;
  bannerEl.classList.add('on');
}
function hideBanner(){ bannerEl.classList.remove('on'); bannerHandler = null; }
bannerAct.addEventListener('click', () => { if(bannerHandler) bannerHandler(); });

/* ============================== formatting ============================== */
/* Always shown in the clock the phone is on, because that is when it will
   actually ring. A reminder pinned to another zone carries that zone's own
   time in its badge instead. */
function fmtWhen(it){
  if(it.due == null) return 'No alert set';
  const tz = 'local';
  const w = epochToWall(tz, it.due);
  const nw = epochToWall(tz, Date.now());
  const dayDiff = Math.round((Date.UTC(w.y,w.mo,w.d) - Date.UTC(nw.y,nw.mo,nw.d)) / 86400000);
  const time = pad2(w.hh) + ':' + pad2(w.mi);
  let day;
  if(dayDiff === 0) day = 'Today';
  else if(dayDiff === 1) day = 'Tomorrow';
  else if(dayDiff === -1) day = 'Yesterday';
  else if(dayDiff > 1 && dayDiff < 7){
    day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(w.y,w.mo,w.d)).getUTCDay()];
  } else {
    day = pad2(w.d) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][w.mo];
  }
  return day + '  ' + time;
}
function relRemain(ts){
  const ms = ts - Date.now();
  if(ms < 0){
    const m = Math.round(-ms/60000);
    if(m < 60) return m + ' min late';
    const h = Math.round(m/60);
    if(h < 24) return h + ' h late';
    return Math.round(h/24) + ' d late';
  }
  const mins = Math.round(ms/60000);
  if(mins < 60) return 'in ' + mins + ' min';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return 'in ' + hrs + ' h';
  return 'in ' + Math.round(hrs/24) + ' d';
}
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

/* ============================== render ============================== */
const listEl = document.getElementById('list');
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
};

function matchesQuery(i){
  if(!query) return true;
  const q = query.toLowerCase();
  return [i.title, i.vessel, i.ref, i.notes, i.heard].some(f => (f||'').toLowerCase().includes(q));
}
function counts(){
  const now = Date.now();
  const nw = epochToWall('local', now);
  const endToday = new Date(nw.y, nw.mo, nw.d + 1).getTime();
  const week = now + 7*86400000;
  const open = items.filter(i => !i.done);
  return {
    open: open.length,
    today: open.filter(i => i.due != null && i.due < endToday).length,
    week: open.filter(i => i.due != null && i.due <= week).length,
    high: open.filter(i => i.priority === 'high').length,
    done: items.filter(i => i.done).length,
    all: items.length
  };
}
function visible(){
  const now = Date.now();
  const nw = epochToWall('local', now);
  const endToday = new Date(nw.y, nw.mo, nw.d + 1).getTime();
  const week = now + 7*86400000;
  let v = items.filter(matchesQuery);
  if(filter === 'open') v = v.filter(i => !i.done);
  else if(filter === 'today') v = v.filter(i => !i.done && i.due != null && i.due < endToday);
  else if(filter === 'week') v = v.filter(i => !i.done && i.due != null && i.due <= week);
  else if(filter === 'high') v = v.filter(i => !i.done && i.priority === 'high');
  else if(filter === 'done') v = v.filter(i => i.done);
  v.sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(a.due == null) return 1;
    if(b.due == null) return -1;
    return a.due - b.due;
  });
  return v;
}

function card(i, now){
  const overdue = !i.done && i.due != null && i.due < now;
  let tzl = tzLabel(i.tz);
  if(tzl && i.due != null){
    const zw = epochToWall(i.tz, i.due);
    tzl += ' ' + pad2(zw.hh) + ':' + pad2(zw.mi);
  }
  const sub = [i.vessel, i.ref].filter(Boolean).join(' · ');
  return '<article class="card k-' + i.kind + (i.done?' done':'') + (overdue?' overdue':'') +
      '" data-id="' + i.id + '">' +
    '<button class="tick" data-act="toggle" aria-label="' + (i.done ? 'Reopen' : 'Mark done') + ': ' + esc(i.title) + '">' + ICON.check + '</button>' +
    '<div class="body">' +
      '<p class="title">' + esc(i.title) + '</p>' +
      '<div class="meta">' +
        '<span class="when">' + esc(fmtWhen(i)) + (i.due != null && !i.done ? '  ·  ' + relRemain(i.due) : '') + '</span>' +
        '<span class="tag">' + KIND_LABEL[i.kind] + '</span>' +
        (i.repeat ? '<span class="tag rep">' + i.repeat + '</span>' : '') +
        (tzl ? '<span class="tag tz">' + esc(tzl) + '</span>' : '') +
        (i.priority === 'high' ? '<span class="tag pri">High</span>' : '') +
      '</div>' +
      (sub ? '<div class="sub2">' + esc(sub) + '</div>' : '') +
      (i.notes ? '<div class="sub2">' + esc(i.notes) + '</div>' : '') +
      (i.heard ? '<div class="heard">Heard: "' + esc(i.heard) + '"</div>' : '') +
    '</div>' +
    '<div class="rowacts"><button class="iact" data-act="expand" aria-label="More actions for ' + esc(i.title) + '" aria-expanded="false">' + ICON.more + '</button></div>' +
    '<div class="tray">' +
      '<button class="sbtn edit" data-act="edit">Edit</button>' +
      '<button class="sbtn" data-act="snooze" data-min="15">+15m</button>' +
      '<button class="sbtn" data-act="snooze" data-min="60">+1h</button>' +
      '<button class="sbtn" data-act="snooze" data-min="1440">+1d</button>' +
      '<button class="sbtn" data-act="ics">Calendar</button>' +
      '<button class="sbtn del" data-act="delete">Delete</button>' +
    '</div>' +
  '</article>';
}

function render(){
  const c = counts();
  ['open','today','week','high','done','all'].forEach(k => {
    const el = document.getElementById('c-' + k);
    if(el) el.textContent = c[k];
  });

  const next = items.filter(i => !i.done && i.due != null).sort((a,b)=>a.due-b.due)[0];
  document.getElementById('subline').textContent = next
    ? 'Next: ' + next.title.slice(0,26) + (next.title.length>26?'…':'') + ' · ' + relRemain(next.due)
    : 'Voice reminders';

  const v = visible();
  if(!v.length){
    listEl.innerHTML = query
      ? '<div class="empty"><p>Nothing matches "' + esc(query) + '".</p></div>'
      : '<div class="empty">' + ICON.bell +
        '<p>Nothing here yet.</p><div class="eg">' +
        '"remind me to follow up with CMA CGM on Friday 10am"<br>' +
        '"meeting with the yard tomorrow 9:30"<br>' +
        '"call the Class surveyor in 2 hours"<br>' +
        '"every month send the invoice on the 28th at 9am"</div></div>';
    return;
  }

  const now = Date.now();
  const nw = epochToWall('local', now);
  const endToday = new Date(nw.y, nw.mo, nw.d + 1).getTime();
  const endTomorrow = endToday + 86400000;
  const order = ['Overdue','Today','Tomorrow','Later','No alert set','Done'];
  const G = {}; order.forEach(k => G[k] = []);
  v.forEach(i => {
    if(i.done) G['Done'].push(i);
    else if(i.due == null) G['No alert set'].push(i);
    else if(i.due < now) G['Overdue'].push(i);
    else if(i.due < endToday) G['Today'].push(i);
    else if(i.due < endTomorrow) G['Tomorrow'].push(i);
    else G['Later'].push(i);
  });
  let html = '';
  order.forEach(name => {
    if(!G[name].length) return;
    html += '<div class="group-label' + (name==='Overdue'?' urgent':'') + '">' + name + '</div>';
    G[name].forEach(i => { html += card(i, now); });
  });
  listEl.innerHTML = html;
}

/* ============================== mutations ============================== */
/* Every change funnels through here so timers and storage never drift apart. */
function mutate(id, action, opts){
  const r = applyAction(items, id, action, opts || {});
  if(!r.changed) return r;
  save();
  if(action === 'delete'){
    clearTimer(id);
    lastDeleted = {item:r.removed, index:r.index};
    ringing = ringing.filter(x => x.id !== id);
    toast('Deleted', 'Undo', undoDelete);
  } else {
    rescheduleOne(id);
  }
  render();
  return r;
}
function undoDelete(){
  if(!lastDeleted) return;
  items.splice(Math.min(lastDeleted.index, items.length), 0, lastDeleted.item);
  save(); rescheduleOne(lastDeleted.item.id); render();
  toast('Restored');
  lastDeleted = null;
}

listEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const cardEl = btn.closest('.card');
  const id = cardEl.dataset.id;
  const it = items.find(x => x.id === id);
  if(!it) return;
  const act = btn.dataset.act;

  if(act === 'expand'){
    const open = cardEl.classList.toggle('expanded');
    btn.setAttribute('aria-expanded', String(open));
    return;
  }
  if(act === 'toggle'){
    const r = mutate(id, it.done ? 'uncomplete' : 'complete');
    if(r.reason === 'rescheduled') toast('Next: ' + fmtWhen(items.find(x=>x.id===id)));
    return;
  }
  if(act === 'snooze'){ mutate(id, 'snooze', {minutes: parseInt(btn.dataset.min,10)});
    toast('Moved to ' + fmtWhen(items.find(x=>x.id===id))); return; }
  if(act === 'edit'){ openEditor(it); return; }
  if(act === 'ics'){ exportICS([it]); return; }
  if(act === 'delete'){ mutate(id, 'delete'); return; }
});

/* ============================== filters & search ============================== */
document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  filter = chip.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
  render();
});
const searchbar = document.getElementById('searchbar');
const searchInput = document.getElementById('searchInput');
document.getElementById('searchBtn').addEventListener('click', () => {
  const on = searchbar.classList.toggle('on');
  if(on) searchInput.focus();
  else { searchInput.value = ''; query = ''; render(); }
});
searchInput.addEventListener('input', () => { query = searchInput.value.trim(); render(); });

/* ============================== dialog plumbing ============================== */
let openSheet = null, lastFocus = null;
function showSheet(el){
  lastFocus = document.activeElement;
  openSheet = el;
  el.classList.add('on');
  const first = el.querySelector('input, select, textarea, button');
  if(first) setTimeout(() => first.focus(), 60);
}
function closeSheet(el){
  (el || openSheet)?.classList.remove('on');
  if(openSheet === el || !el) openSheet = null;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && openSheet){ e.preventDefault(); closeSheet(openSheet); return; }
  if(e.key !== 'Tab' || !openSheet) return;
  const f = [...openSheet.querySelectorAll('input,select,textarea,button,[href]')]
    .filter(x => !x.disabled && x.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
document.querySelectorAll('.sheet').forEach(s => {
  s.addEventListener('click', e => { if(e.target === s) closeSheet(s); });
});

/* ============================== confirm / edit ============================== */
const editSheet = document.getElementById('editSheet');
const F = {
  title:  document.getElementById('fTitle'),
  date:   document.getElementById('fDate'),
  time:   document.getElementById('fTime'),
  tz:     document.getElementById('fTz'),
  repeat: document.getElementById('fRepeat'),
  kind:   document.getElementById('fKind'),
  vessel: document.getElementById('fVessel'),
  ref:    document.getElementById('fRef'),
  priority:document.getElementById('fPriority'),
  notes:  document.getElementById('fNotes')
};
TZ_CHOICES.forEach(t => {
  const o = document.createElement('option');
  o.value = t.id; o.textContent = t.label; F.tz.appendChild(o);
});
REPEATS.forEach(r => {
  const o = document.createElement('option');
  o.value = r.id; o.textContent = r.label; F.repeat.appendChild(o);
});

function openConfirm(draft){
  pendingDraft = draft; editingId = null;
  document.getElementById('editTitle').textContent = 'Check this reminder';
  document.getElementById('editLead').textContent = 'Confirm what was understood before it is saved.';
  fillEditor(draft);
  showSheet(editSheet);
}
function openEditor(it){
  pendingDraft = itemToDraft(it); editingId = it.id;
  document.getElementById('editTitle').textContent = 'Edit reminder';
  document.getElementById('editLead').textContent = 'Changes take effect as soon as you save.';
  fillEditor(pendingDraft);
  showSheet(editSheet);
}

function fillEditor(d){
  F.title.value = d.title || '';
  F.tz.value = d.tz || 'local';
  F.repeat.value = d.repeat || '';
  F.kind.value = d.kind || 'task';
  F.vessel.value = d.vessel || '';
  F.ref.value = d.ref || '';
  F.priority.value = d.priority || 'normal';
  F.notes.value = d.notes || '';

  if(d.y != null && d.hh != null){
    F.date.value = d.y + '-' + pad2(d.mo + 1) + '-' + pad2(d.d);
    F.time.value = pad2(d.hh) + ':' + pad2(d.mi);
  } else {
    F.date.value = ''; F.time.value = '';
  }

  document.getElementById('wrapDate').classList.toggle('flag', !!d.assumedDate);
  document.getElementById('wrapTime').classList.toggle('flag', !!d.assumedTime || !!d.ambiguousTime);

  const errBox = document.getElementById('editErr');
  if(d.errors && d.errors.length){
    errBox.textContent = d.errors.join(' ') + ' Please set the date and time below.';
    errBox.classList.add('on');
  } else errBox.classList.remove('on');

  const assume = document.getElementById('editAssume');
  const notes = [];
  if(d.ambiguousTime) notes.push('"' + (d.heard||'') .trim() + '" did not say am or pm — pick the right one.');
  else if(d.assumedTime) notes.push('No exact time was said, so one was assumed. Change it if that is wrong.');
  if(d.assumedDate) notes.push('No date was said, so the next occurrence of that time was used.');
  if(d.noTime) notes.push('No time was recognised. Set one below, or save it with no alert.');
  if(notes.length){ assume.textContent = notes.join(' '); assume.classList.add('on'); }
  else assume.classList.remove('on');

  const ambig = document.getElementById('editAmbig');
  ambig.innerHTML = '';
  if(d.ambiguousTime && d.ambiguousOptions){
    d.ambiguousOptions.forEach(o => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label + (o.hh < 12 ? ' (morning)' : ' (evening)');
      b.setAttribute('aria-pressed', String(o.hh === d.hh));
      b.addEventListener('click', () => {
        F.time.value = pad2(o.hh) + ':' + pad2(o.mi);
        [...ambig.children].forEach(c => c.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        document.getElementById('wrapTime').classList.remove('flag');
      });
      ambig.appendChild(b);
    });
    ambig.classList.add('on');
  } else ambig.classList.remove('on');

  document.getElementById('editNoAlert').style.display = (d.noTime || !F.time.value) ? 'flex' : 'none';
  updateTzNote();
}
function updateTzNote(){
  const n = document.getElementById('tzNote');
  if(F.tz.value === 'local'){
    n.textContent = 'Follows this device. If you travel, the alert moves with the clock.';
  } else {
    n.textContent = 'Fixed to ' + F.tz.value + '. The alert stays at that zone’s clock time wherever you are.';
  }
}
F.tz.addEventListener('change', updateTzNote);
F.time.addEventListener('input', () => {
  document.getElementById('wrapTime').classList.remove('flag');
  document.getElementById('editNoAlert').style.display = F.time.value ? 'none' : 'flex';
});
F.date.addEventListener('input', () => document.getElementById('wrapDate').classList.remove('flag'));

function readEditor(withAlert){
  const d = Object.assign({}, pendingDraft);
  d.title = F.title.value.trim() || 'Reminder';
  d.tz = F.tz.value;
  d.repeat = F.repeat.value;
  d.kind = F.kind.value;
  d.vessel = F.vessel.value.trim();
  d.ref = F.ref.value.trim();
  d.priority = F.priority.value;
  d.notes = F.notes.value.trim();
  d.errors = [];

  if(!withAlert || !F.date.value || !F.time.value){
    d.noTime = true; d.y = d.mo = d.d = d.hh = null; d.mi = 0;
    return d;
  }
  const dm = F.date.value.split('-').map(Number);
  const tm = F.time.value.split(':').map(Number);
  if(dm.length !== 3 || tm.length < 2 || !validDate(dm[0], dm[1]-1, dm[2]) || !validTime(tm[0], tm[1])){
    d.errors.push('That date or time is not valid.');
    return d;
  }
  d.noTime = false;
  d.y = dm[0]; d.mo = dm[1]-1; d.d = dm[2]; d.hh = tm[0]; d.mi = tm[1];
  if(d.repeat === 'monthly') d.anchorDay = d.d;
  return d;
}

function commitEditor(withAlert){
  const d = readEditor(withAlert);
  if(d.errors.length){
    const e = document.getElementById('editErr');
    e.textContent = d.errors.join(' ');
    e.classList.add('on');
    return;
  }
  if(!d.noTime){
    const when = wallToEpoch(d.tz, d.y, d.mo, d.d, d.hh, d.mi);
    if(when < Date.now() - 60000 && !editingId && !d.repeat){
      const e = document.getElementById('editErr');
      e.textContent = 'That time is in the past. Change it, or save with no alert.';
      e.classList.add('on');
      document.getElementById('editNoAlert').style.display = 'flex';
      return;
    }
  }
  const existing = editingId ? items.find(x => x.id === editingId) : null;
  const it = draftToItem(d, existing);
  if(existing){
    const idx = items.findIndex(x => x.id === editingId);
    items[idx] = it;
  } else {
    items.push(it);
  }
  const okSaved = save();
  rescheduleOne(it.id);
  render();
  closeSheet(editSheet);
  pendingDraft = null; editingId = null;
  if(okSaved){
    toast(it.due == null ? 'Saved with no alert' : KIND_LABEL[it.kind] + ' set · ' + fmtWhen(it));
  }
}
document.getElementById('editSave').addEventListener('click', () => commitEditor(true));
document.getElementById('editNoAlert').addEventListener('click', () => commitEditor(false));
document.getElementById('editCancel').addEventListener('click', () => {
  closeSheet(editSheet); pendingDraft = null; editingId = null;
});

/* ============================== speech ============================== */
const micBtn = document.getElementById('micBtn');
const hint = document.getElementById('hint');
const transcriptEl = document.getElementById('transcript');
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
const speaker = makeSpeaker();

/* One recogniser, driven as a state machine. Only one listener can be active
   at a time, so every caller goes through listenOnce(). */
let rec = null, listening = false, finalText = '';
let micMode = 'idle';        // idle | command | reply
let listenResolve = null, listenTimer = null;
let handsFree = false, tappedMic = false, speaking = false;
let speakEnabled = true;
try{ speakEnabled = localStorage.getItem('watchkeeper.speak') !== 'off'; }catch(e){}

/* Inside the Android app the platform engines are used instead of the
   WebView's, which has no speech recognition and unreliable synthesis. */
const NATIVE = (window.Native && window.Native.available) ? window.Native : null;

async function speak(text){
  if(!speakEnabled) return false;
  if(!NATIVE && !speaker.supported) return false;
  stopListening();
  speaking = true;
  showSpeaking(text);
  const r = NATIVE ? await NATIVE.say(text) : await speaker.say(text, {rate:1.03});
  speaking = false;
  return r;
}
function showSpeaking(text){
  transcriptEl.classList.add('on');
  transcriptEl.innerHTML = '<div class="parsed">Watchkeeper says</div><div class="live">' + esc(text) + '</div>';
}
function stopListening(){
  if(listenTimer){ clearTimeout(listenTimer); listenTimer = null; }
  if(rec && listening){ try{ rec.abort(); }catch(e){} }
  if(NATIVE) NATIVE.stopListening();
  listening = false;
  micBtn.classList.remove('listening');
}

/* Listen for a single phrase. Resolves with '' on silence or error so every
   caller can simply branch on an empty string. */
function listenOnce(ms, label){
  if(NATIVE){
    stopListening();
    micBtn.classList.add('listening');
    hint.textContent = label || 'Listening…';
    showTranscript('', 'listening');
    return NATIVE.listen(ms || 7000).then(r => {
      micBtn.classList.remove('listening');
      return (r.text || '').trim();
    });
  }
  if(!rec) return Promise.resolve('');
  stopListening();
  return new Promise(resolve => {
    let settled = false;
    const done = v => {
      if(settled) return;
      settled = true;
      if(listenTimer){ clearTimeout(listenTimer); listenTimer = null; }
      listenResolve = null;
      micBtn.classList.remove('listening');
      resolve((v || '').trim());
    };
    listenResolve = done;
    micMode = 'reply';
    finalText = '';
    hint.textContent = label || 'Listening…';
    try{ rec.start(); }
    catch(e){
      try{ rec.abort(); }catch(_){}
      setTimeout(() => { try{ rec.start(); }catch(__){ done(''); } }, 220);
    }
    listenTimer = setTimeout(() => { try{ rec.stop(); }catch(e){} done(finalText); }, ms || 7000);
  });
}

const LANGS = ['en-SG','en-IN','en-GB','en-US','en-AU'];
const langBtn = document.getElementById('langBtn');
let lang = 'en-SG';
try{ lang = localStorage.getItem('watchkeeper.lang') || 'en-SG'; }catch(e){}
langBtn.textContent = lang;
langBtn.addEventListener('click', () => {
  lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
  langBtn.textContent = lang;
  if(rec) rec.lang = lang;
  speaker.setLang(lang);
  try{ localStorage.setItem('watchkeeper.lang', lang); }catch(e){}
  toast('Recognition set to ' + lang);
});

function showTranscript(live, parsed){
  transcriptEl.classList.add('on');
  transcriptEl.innerHTML = '<div class="live">' + esc(live || '…') + '</div>' +
    (parsed ? '<div class="parsed">' + esc(parsed) + '</div>' : '');
}
function hideTranscript(){ transcriptEl.classList.remove('on'); transcriptEl.innerHTML = ''; }

if(NATIVE){
  /* The app route: one tap, the platform recogniser, then the same handler. */
  micBtn.addEventListener('click', async () => {
    speaker.cancel(); NATIVE.stopSpeaking(); speaking = false;
    if(listening){ NATIVE.stopListening(); listening = false; micBtn.classList.remove('listening'); return; }
    listening = true;
    const said = await listenOnce(9000, 'Listening… speak now');
    listening = false;
    hideTranscript();
    hint.textContent = 'Tap mic and speak';
    if(said) handleSpoken(said);
    else hint.textContent = 'Did not catch that';
  });
} else if(!SRC){
  hint.textContent = 'Voice unavailable here — use the pencil';
  micBtn.disabled = true;
} else {
  rec = new SRC();
  rec.lang = lang; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;

  rec.onstart = () => {
    listening = true; finalText = '';
    micBtn.classList.add('listening');
    if(micMode === 'command'){ hint.textContent = 'Listening… tap to stop'; showTranscript('', ''); }
  };
  rec.onresult = ev => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) finalText += t + ' ';
      else interim += t;
    }
    const whole = (finalText + interim).trim();
    if(micMode === 'command'){
      const p = parseDraft(whole, new Date(), 'local');
      const line = p.errors.length ? p.errors[0]
        : p.noTime ? 'no time heard yet'
        : KIND_LABEL[p.kind] + ' → ' + pad2(p.d) + '/' + pad2(p.mo+1) + ' ' + pad2(p.hh) + ':' + pad2(p.mi);
      showTranscript(whole, line);
    } else {
      showTranscript(whole, 'listening for your answer');
    }
  };
  rec.onerror = ev => {
    listening = false; micBtn.classList.remove('listening');
    const e = ev.error;
    if(e === 'not-allowed'){
      hint.textContent = 'Mic blocked — allow it in site settings';
      handsFree = false; paintHandsFree();
    } else if(e === 'no-speech'){
      hint.textContent = 'Did not catch that';
    } else if(e === 'network'){
      hint.textContent = 'Speech needs a connection';
    } else if(e !== 'aborted'){
      hint.textContent = 'Mic error: ' + e;
    }
    if(listenResolve) listenResolve(finalText);
  };
  rec.onend = () => {
    listening = false; micBtn.classList.remove('listening');
    const said = finalText.trim();
    if(listenResolve){ listenResolve(said); return; }      // a reply handler owns this
    hint.textContent = handsFree ? 'Hands-free — say "Watchkeeper…"' : 'Tap mic and speak';
    hideTranscript();
    const wasCommand = micMode === 'command';
    micMode = 'idle';
    if(wasCommand && said){
      if(handsFree && !tappedMic){
        /* Hands-free only acts on speech addressed to the app, so ordinary
           conversation in the office is ignored. */
        if(WAKE.test(said)) handleSpoken(said.replace(WAKE, '').replace(/^[\s,.:;]+/, ''));
      } else {
        handleSpoken(said);
      }
    }
    tappedMic = false;
    if(handsFree && !openSheet) setTimeout(startHandsFreeListen, 600);
  };

  micBtn.addEventListener('click', () => {
    unlockAudio();
    speaker.cancel(); speaking = false;
    if(listening){ try{ rec.stop(); }catch(e){} return; }
    micMode = 'command'; tappedMic = true;
    try{ rec.start(); }catch(e){ try{ rec.abort(); }catch(_){} }
  });
}

/* ============================== spoken commands ============================== */
/* Everything said at the mic lands here: a query, a control word, or a new
   reminder. */
async function handleSpoken(said){
  const cmd = parseCommand(said);
  if(cmd.type === 'stop'){ speaker.cancel(); stopAlarmSound(); return; }
  if(cmd.type === 'undo'){ undoDelete(); await speak('Put back.'); return; }
  if(cmd.type === 'help'){
    await speak('Say a reminder, like: follow up with the yard tomorrow at ten. ' +
      'Then say save, or say a correction. You can also ask what is next, or say done or snooze when an alarm rings.');
    return;
  }
  if(cmd.type === 'next'){ await speakNext(); return; }
  if(cmd.type === 'today'){ await speakList('today'); return; }
  if(cmd.type === 'list'){ await speakList('all'); return; }
  voiceConfirm(parseDraft(said, new Date(), 'local'));
}

async function speakNext(){
  const n = items.filter(i => !i.done && i.due != null).sort((a,b) => a.due - b.due)[0];
  if(!n){ await speak('Nothing scheduled.'); return; }
  const w = epochToWall('local', n.due);
  await speak('Next: ' + n.title + ', ' + spokenDay(w.y, w.mo, w.d) + ' at ' + spokenTime(w.hh, w.mi) + '.');
}
async function speakList(scope){
  const now = Date.now();
  const nw = epochToWall('local', now);
  const endToday = new Date(nw.y, nw.mo, nw.d + 1).getTime();
  let list = items.filter(i => !i.done && i.due != null);
  if(scope === 'today') list = list.filter(i => i.due < endToday);
  list.sort((a,b) => a.due - b.due);
  if(!list.length){ await speak(scope === 'today' ? 'Nothing left today.' : 'Nothing scheduled.'); return; }
  const head = list.length === 1 ? 'One reminder. ' : list.length + ' reminders. ';
  const body = list.slice(0, 6).map(i => {
    const w = epochToWall('local', i.due);
    return i.title + ', ' + spokenDay(w.y, w.mo, w.d) + ' at ' + spokenTime(w.hh, w.mi);
  }).join('. ');
  await speak(head + body + '.');
}

/* ============================== spoken confirmation ============================== */
/* Reads the reminder back, then listens. "Yes" saves, "no" discards, and
   anything carrying a new time is treated as a correction. */
async function voiceConfirm(draft, round){
  round = round || 0;
  openConfirm(draft);                       // the dialog is the visual record
  /* Inside the app there is no web recogniser — listening goes through the
     bridge instead, so NATIVE counts as voice being available. */
  if(!speakEnabled || (!rec && !NATIVE) || round > 3){ return; }

  await speak(draftSentence(draft, new Date()) + ' ' + confirmPrompt(draft));
  if(!editSheet.classList.contains('on')) return;   // user closed it meanwhile

  const reply = await listenOnce(7000, 'Say yes, no, or a correction');
  if(!editSheet.classList.contains('on')) return;

  if(draft.ambiguousTime){
    const ap = parseAmPmReply(reply);
    if(ap){
      const pick = draft.ambiguousOptions.find(o => (ap === 'am') === (o.hh < 12));
      if(pick){
        draft.hh = pick.hh; draft.mi = pick.mi;
        draft.ambiguousTime = false; draft.ambiguousOptions = null;
        fillEditor(draft);
        return voiceConfirm(draft, round + 1);
      }
    }
  }

  const r = parseConfirmReply(reply);
  if(r.type === 'yes'){
    commitEditor(!(draft.noTime && !F.time.value));
    await speak('Saved.');
    return;
  }
  if(r.type === 'no'){
    closeSheet(editSheet); pendingDraft = null; editingId = null;
    await speak('Cancelled.');
    return;
  }
  if(r.type === 'repeat') return voiceConfirm(draft, round + 1);
  if(r.type === 'change'){
    const fix = parseDraft(r.text, new Date(), draft.tz);
    if(fix.y != null){ draft.y = fix.y; draft.mo = fix.mo; draft.d = fix.d; draft.assumedDate = false; }
    if(fix.hh != null){
      draft.hh = fix.hh; draft.mi = fix.mi;
      draft.assumedTime = false;
      draft.ambiguousTime = fix.ambiguousTime;
      draft.ambiguousOptions = fix.ambiguousOptions;
    }
    if(fix.repeat) draft.repeat = fix.repeat;
    draft.noTime = (draft.hh == null);
    draft.errors = [];
    fillEditor(draft);
    return voiceConfirm(draft, round + 1);
  }
  /* Nothing usable heard — leave the dialog open and let the buttons finish it. */
  if(round < 2 && reply) return voiceConfirm(draft, round + 1);
  if(!reply) await speak('I did not hear you. Use the buttons, or tap the mic again.');
}

/* ============================== hands-free ============================== */
const WAKE = /\b(watch\s*keeper|watchkeeper|watch keeper|hey keeper|watchkipper|watch kipper)\b/i;
let nativeLoopRunning = false;
function startHandsFreeListen(){
  if(!handsFree || listening || openSheet || speaking) return;
  if(NATIVE){ startNativeHandsFree(); return; }
  if(!rec) return;
  micMode = 'command';
  finalText = '';
  try{ rec.start(); }catch(e){ /* already running */ }
}

/* The platform recogniser returns one phrase at a time, so hands-free is a
   loop rather than a continuous stream. It pauses whenever a dialog is open
   or the app is speaking, so it never hears itself. */
async function startNativeHandsFree(){
  if(nativeLoopRunning) return;
  nativeLoopRunning = true;
  try{
    while(handsFree && NATIVE){
      if(openSheet || speaking || alarmEl.classList.contains('on')){
        await new Promise(r => setTimeout(r, 700));
        continue;
      }
      micBtn.classList.add('listening');
      const r = await NATIVE.listen(8000);
      micBtn.classList.remove('listening');
      if(!handsFree) break;
      const said = (r.text || '').trim();
      if(said && WAKE.test(said)){
        await handleSpoken(said.replace(WAKE, '').replace(/^[\s,.:;]+/, ''));
      }
      await new Promise(r2 => setTimeout(r2, 400));
    }
  } finally {
    nativeLoopRunning = false;
    micBtn.classList.remove('listening');
  }
}
function paintHandsFree(){
  const b = document.getElementById('handsBtn');
  if(!b) return;
  b.setAttribute('aria-pressed', String(handsFree));
  b.classList.toggle('on', handsFree);
  hint.textContent = handsFree ? 'Hands-free — say "Watchkeeper…"' : 'Tap mic and speak';
}
document.getElementById('handsBtn').addEventListener('click', async () => {
  unlockAudio();
  if(!rec && !NATIVE){ toast('Voice is not available in this browser'); return; }
  handsFree = !handsFree;
  try{ localStorage.setItem('watchkeeper.handsfree', handsFree ? 'on' : 'off'); }catch(e){}
  paintHandsFree();
  if(handsFree){
    await speak('Hands-free on. Say Watchkeeper, then your reminder.');
    startHandsFreeListen();
  } else {
    stopListening();
    toast('Hands-free off');
  }
});
try{ handsFree = localStorage.getItem('watchkeeper.handsfree') === 'on'; }catch(e){}

/* ============================== typed entry ============================== */
const typeSheet = document.getElementById('typeSheet');
const typeInput = document.getElementById('typeInput');
document.getElementById('typeBtn').addEventListener('click', () => {
  unlockAudio(); typeInput.value = ''; showSheet(typeSheet);
});
document.getElementById('typeCancel').addEventListener('click', () => closeSheet(typeSheet));
function typedNext(){
  const t = typeInput.value.trim();
  if(!t) return;
  closeSheet(typeSheet);
  /* Typed entry is the fallback for a noisy engine room or a failed mic, so it
     confirms on screen without talking. */
  setTimeout(() => openConfirm(parseDraft(t, new Date(), 'local')), 120);
}
document.getElementById('typeNext').addEventListener('click', typedNext);
typeInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); typedNext(); } });

/* ============================== service worker ============================== */
/* Android Chrome refuses `new Notification()`; notifications must be shown by a
   service worker registration. This also lets the app open offline.
   The native app has no use for it — alarms and notifications are the
   platform's there — so it is skipped entirely. */
let swReg = null, swState = NATIVE ? 'native' : 'unsupported';
if(!NATIVE && 'serviceWorker' in navigator){
  swState = 'registering';
  navigator.serviceWorker.register('sw.js')
    .then(r => { swReg = r; swState = 'registered'; return navigator.serviceWorker.ready; })
    .then(r => { swReg = r || swReg; swState = 'ready'; paintStatusDot(); })
    .catch(() => { swState = 'failed'; paintStatusDot(); });
  navigator.serviceWorker.addEventListener('message', ev => {
    const d = ev.data || {};
    if(d.type === 'notification-action') handleRemoteAction(d.action, d.id);
  });
}

/* An action tapped on a notification while the app was closed arrives in the
   URL; one tapped while it was open arrives as a message. Both land here. */
function handleRemoteAction(action, id){
  if(!id) return;
  const it = items.find(x => x.id === id);
  if(!it) return;
  if(action === 'done'){
    const r = mutate(id, 'complete');
    toast(r.reason === 'rescheduled' ? 'Next: ' + fmtWhen(items.find(x=>x.id===id)) : 'Marked done');
  } else if(action === 'snooze'){
    mutate(id, 'snooze', {minutes:10});
    toast('Back at ' + fmtWhen(items.find(x=>x.id===id)));
  } else {
    showAlarm(it);
    return;
  }
  ringing = ringing.filter(x => x.id !== id);
  if(!ringing.length) stopAlarm();
  else paintAlarm();
}
function consumeHashAction(){
  const h = location.hash || '';
  const m = h.match(/act=([a-z]+)&id=([A-Za-z0-9_-]+)/);
  if(!m) return;
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  handleRemoteAction(m[1], m[2]);
}
/* The worker may hand the action to a window that is already open, in which
   case only the hash changes and the page never reloads. */
window.addEventListener('hashchange', consumeHashAction);

/* ============================== alarm sound ============================== */
let actx = null, alarmTimer = null;
function unlockAudio(){
  if(actx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0.0001; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.02);
  }catch(e){ actx = null; }
}
['pointerdown','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, {passive:true}));

function beep(){
  if(!actx) return;
  if(actx.state === 'suspended') actx.resume();
  const t = actx.currentTime;
  [0, 0.22].forEach((off, n) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(n ? 740 : 988, t + off);
    g.gain.setValueAtTime(0.0001, t + off);
    g.gain.exponentialRampToValueAtTime(0.32, t + off + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.19);
    o.connect(g); g.connect(actx.destination);
    o.start(t + off); o.stop(t + off + 0.2);
  });
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([260,140,260,140,420]); }catch(e){} }
/* Exactly one layer owns the sound. In the app that is the system ringer, so
   the page stays silent — two alarms ringing at once is worse than none, and
   the page cannot stop a tone it did not start. */
function startAlarm(){
  if(NATIVE) return;
  stopAlarmSound();
  beep(); buzz();
  let n = 0;
  alarmTimer = setInterval(() => {
    if(++n > 20){ stopAlarmSound(); return; }
    beep(); if(n % 2 === 0) buzz();
  }, 2800);
}
function stopAlarmSound(){
  if(alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  if(NATIVE) NATIVE.stopRinging();
}
function stopAlarm(){ stopAlarmSound(); document.getElementById('alarm').classList.remove('on'); }

/* ============================== alarm screen ============================== */
const alarmEl = document.getElementById('alarm');
let ringing = [];
function showAlarm(it){
  if(!it) return;
  if(!ringing.find(x => x.id === it.id)) ringing.push(it);
  paintAlarm();
  alarmEl.classList.add('on');
  startAlarm();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  alarmVoiceRound = 0;
  runAlarmVoice();
}

/* The alarm announces itself and then listens, so it can be dealt with
   without touching the phone. */
let alarmVoiceRound = 0, alarmVoiceBusy = false;
async function runAlarmVoice(){
  if(alarmVoiceBusy) return;
  const it = ringing[0];
  if(!it || !speakEnabled || (!rec && !NATIVE)){ return; }
  /* In the app, the lock-screen alarm does its own speaking. The page only
     takes over when it is the thing on screen, so the two never talk at once. */
  if(NATIVE && document.visibilityState !== 'visible'){ return; }
  alarmVoiceBusy = true;
  try{
    while(ringing[0] && ringing[0].id === it.id && alarmVoiceRound < 4){
      stopAlarmSound();
      const line = alarmVoiceRound === 0
        ? (KIND_LABEL[it.kind] + ' due. ' + it.title + '. Say done, or say snooze.')
        : 'Still waiting. Say done, or say snooze.';
      await speak(line);
      if(!ringing[0] || ringing[0].id !== it.id) break;
      const reply = await listenOnce(6500, 'Say "done" or "snooze"');
      if(!ringing[0] || ringing[0].id !== it.id) break;
      const r = parseAlarmReply(reply);
      if(r.type === 'done'){
        if(it.id !== 'test'){
          const res = mutate(it.id, 'complete');
          await speak(res.reason === 'rescheduled'
            ? 'Done. Next one ' + fmtWhen(items.find(x => x.id === it.id)) + '.'
            : 'Done.');
        } else await speak('Done.');
        dismissTop();
        break;
      }
      if(r.type === 'snooze'){
        if(it.id !== 'test'){
          mutate(it.id, 'snooze', {minutes: r.minutes});
          await speak('Snoozed. Back ' + fmtWhen(items.find(x => x.id === it.id)) + '.');
        } else await speak('Snoozed.');
        dismissTop();
        break;
      }
      alarmVoiceRound++;
      startAlarm();
    }
  } finally {
    alarmVoiceBusy = false;
    /* Anything still ringing keeps its tone going for the buttons. */
    if(ringing.length && alarmEl.classList.contains('on') && !alarmTimer) startAlarm();
    if(ringing.length && alarmVoiceRound < 4){ alarmVoiceRound = 0; }
  }
}
function paintAlarm(){
  const it = ringing[0];
  if(!it){ stopAlarm(); return; }
  document.getElementById('alarmKind').textContent = KIND_LABEL[it.kind] + ' due';
  document.getElementById('alarmWhat').textContent = it.title;
  const extra = [it.vessel, it.ref].filter(Boolean).join(' · ');
  document.getElementById('alarmAt').textContent = fmtWhen(it) + (extra ? '  ·  ' + extra : '');
  document.getElementById('alarmQueued').textContent =
    ringing.length > 1 ? (ringing.length - 1) + ' more waiting' : '';
}
function dismissTop(){
  ringing.shift();
  if(ringing.length){
    paintAlarm(); startAlarm();
    alarmVoiceRound = 0;
    setTimeout(runAlarmVoice, 400);          // announce the next one in the queue
  } else {
    stopAlarm();
    stopListening();
    if(handsFree) setTimeout(startHandsFreeListen, 800);
  }
}
/* Every dismissal silences the ringer first, whichever layer is making the
   noise, so the sound can never outlive the card. */
function silence(){
  stopAlarmSound();
  if(NATIVE) NATIVE.stopRinging();
  speaker.cancel();
  if(NATIVE) NATIVE.stopSpeaking();
  speaking = false;
}
document.getElementById('alarmDone').addEventListener('click', () => {
  silence();
  const it = ringing[0];
  if(it && it.id !== 'test'){
    const r = mutate(it.id, 'complete');
    if(r.reason === 'rescheduled') toast('Next: ' + fmtWhen(items.find(x=>x.id===it.id)));
  }
  dismissTop();
});
document.getElementById('alarmSnooze').addEventListener('click', () => {
  silence();
  const it = ringing[0];
  if(it && it.id !== 'test'){ mutate(it.id, 'snooze', {minutes:10}); toast('Back in 10 minutes'); }
  dismissTop();
});
alarmEl.querySelectorAll('.more button').forEach(b => {
  b.addEventListener('click', () => {
    silence();
    const it = ringing[0];
    if(it && it.id !== 'test'){
      mutate(it.id, 'snooze', {minutes: parseInt(b.dataset.sn,10)});
      toast('Back at ' + fmtWhen(items.find(x=>x.id===it.id)));
    }
    dismissTop();
  });
});

/* ============================== notifications & timers ============================== */
const timers = new Map();
function clearTimer(id){
  const t = timers.get(id);
  if(t){ clearTimeout(t); timers.delete(id); }
  if(NATIVE) NATIVE.cancel(id);
}
function rescheduleOne(id){
  clearTimer(id);
  const it = items.find(x => x.id === id);
  if(!it || it.done || it.due == null) return;

  if(NATIVE){
    /* Handed to AlarmManager, which fires with the phone locked. No page
       timer is needed or wanted alongside it. */
    const extra = [it.vessel, it.ref].filter(Boolean).join(' · ');
    NATIVE.schedule(id, it.due, KIND_LABEL[it.kind] + ': ' + it.title, extra || it.notes || '');
    return;
  }

  const ms = it.due - Date.now();
  if(ms <= 0 || ms > 86400000) return;      // sweep picks up anything outside this window
  timers.set(id, setTimeout(() => { timers.delete(id); tryFire(id); }, ms));
}
function rescheduleAll(){
  timers.forEach((t) => clearTimeout(t));
  timers.clear();
  items.forEach(i => rescheduleOne(i.id));
}

/* The single gate — the timer and the sweep both call it, so nothing fires
   twice and a stale timer for a changed reminder fires nothing at all. */
function tryFire(id){
  const it = shouldFire(items, id, Date.now());
  if(!it) return;
  it.firedAt = Date.now();
  save();
  notify(it);
  showAlarm(it);
  render();
}

async function notify(it){
  if(NATIVE) return;          // the platform alarm already posted its own
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {
    body: [it.title, [it.vessel, it.ref].filter(Boolean).join(' · ')].filter(Boolean).join('\n'),
    tag: 'wk-' + it.id, renotify: true, requireInteraction: true,
    vibrate: [260,140,260,140,420], silent: false, data: {id: it.id},
    actions: [{action:'done', title:'Done'}, {action:'snooze', title:'Snooze 10m'}]
  };
  const title = KIND_LABEL[it.kind] + ' due';
  try{
    const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.ready.catch(()=>null));
    if(reg && reg.showNotification){ await reg.showNotification(title, opts); return; }
    new Notification(title, opts);          // desktop fallback only
  }catch(e){}
}

function sweep(){
  items.slice().forEach(i => tryFire(i.id));
  render();
}
setInterval(sweep, 20000);
setInterval(render, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ sweep(); rescheduleAll(); } });
window.addEventListener('focus', () => { sweep(); rescheduleAll(); });

/* ============================== bell / permission ============================== */
document.getElementById('bellBtn').addEventListener('click', async () => {
  unlockAudio();
  if(!('Notification' in window)){ toast('No notifications in this browser'); return; }
  if(Notification.permission === 'denied'){
    toast('Blocked — Chrome ⋮ → Site settings → Notifications');
    return;
  }
  if(Notification.permission === 'granted'){
    showAlarm({id:'test', title:'Test alarm — this is what a reminder looks like',
               kind:'followup', due:Date.now(), tz:'local', vessel:'', ref:''});
    notify({id:'test', title:'Test alarm', kind:'followup', vessel:'', ref:''});
    return;
  }
  const p = await Notification.requestPermission();
  paintStatusDot();
  if(p === 'granted'){ toast('Alerts on. Tap the bell again to test.'); rescheduleAll(); }
  else toast('Alerts off — reminders still ring while the app is open');
});

/* ============================== menu & status ============================== */
const menuSheet = document.getElementById('menuSheet');
function notifState(){
  if(!('Notification' in window)) return 'unsupported';
  return Notification.permission;
}
function paintStatusDot(){
  const warn = notifState() !== 'granted' || swState === 'failed' || saveBroken;
  document.getElementById('menuBtn').classList.toggle('warn', warn);
}
function row(cls, title, detail){
  return '<div class="status-row"><span class="dotn ' + cls + '"></span>' +
    '<span><b>' + esc(title) + '</b><em>' + esc(detail) + '</em></span></div>';
}
function paintStatus(){
  const n = notifState();
  const secure = window.isSecureContext;
  let html = '';
  html += row(
    n === 'granted' ? 'good' : n === 'denied' ? 'bad' : 'warn',
    'Notifications: ' + (n === 'granted' ? 'allowed' : n === 'denied' ? 'blocked' : n === 'unsupported' ? 'not supported' : 'not asked yet'),
    n === 'granted' ? 'Alerts can appear in the notification shade.'
      : n === 'denied' ? 'Chrome ⋮ → Site settings → Notifications → Allow.'
      : 'Tap the bell beside the mic to turn them on.');
  if(NATIVE){
    html += row(NATIVE.exactAlarms ? 'good' : 'warn',
      'Locked-phone alarms: ' + (NATIVE.exactAlarms ? 'on' : 'limited'),
      NATIVE.exactAlarms
        ? 'Reminders ring with the phone locked, asleep, or in your pocket.'
        : 'Exact alarms are not permitted. Android settings → Apps → Watchkeeper → Alarms & reminders.');
  } else {
    html += row(
      swState === 'ready' ? 'good' : swState === 'failed' ? 'bad' : 'warn',
      'Background worker: ' + swState,
      swState === 'ready' ? 'Required on Android for notifications to appear at all.'
        : swState === 'failed' ? 'Notifications will not show. Check the site is served over https.'
        : 'Starting up.');
  }
  html += row(secure ? 'good' : 'bad', 'Secure connection: ' + (secure ? 'yes' : 'no'),
    secure ? 'Microphone and notifications are permitted.' : 'Microphone and notifications need https. Open the hosted address, not a local file.');
  html += row(saveBroken ? 'bad' : 'good', 'Storage: ' + (saveBroken ? 'failing' : 'working'),
    saveBroken ? 'Reminders are not being saved. Export a backup now.' : items.length + ' reminders saved on this device only.');
  html += row(actx ? 'good' : 'warn', 'Alarm sound: ' + (actx ? 'ready' : 'not unlocked'),
    actx ? 'The alarm can play a tone.' : 'Tap anywhere once to allow sound.');
  const voiceIn = NATIVE ? NATIVE.speechAvailable : !!rec;
  html += row(
    !voiceIn ? 'bad' : handsFree ? 'good' : 'warn',
    'Voice input: ' + (!voiceIn ? 'not supported' : handsFree ? 'hands-free' : 'tap to talk'),
    !voiceIn ? (NATIVE ? 'No speech recogniser on this phone.' : 'This browser has no speech recognition.')
      : handsFree ? 'Listening for "Watchkeeper" while the app is open and on screen.'
      : 'Tap the headset button beside the mic for hands-free.');
  const canSpeak = NATIVE ? true : speaker.supported;
  html += row(canSpeak && speakEnabled ? 'good' : 'warn',
    'Spoken replies: ' + (!canSpeak ? 'not supported' : speakEnabled ? 'on' : 'off'),
    canSpeak ? 'Reminders are read back before saving and when they ring.'
             : 'This browser cannot speak.');
  document.getElementById('statusList').innerHTML = html;

  document.getElementById('bgNote').innerHTML = NATIVE
    ? '<strong>This is the Android app.</strong> Reminders are handed to the system alarm clock, ' +
      'so they ring with the phone locked, asleep or in your pocket — the same way the clock app does. ' +
      'They survive a restart. Nothing is sent anywhere: the list stays on this phone. ' +
      'Speech uses the phone’s own recogniser, which works offline once the language pack is installed.'
    : '<strong>What this app can and cannot do.</strong> Alerts fire reliably while Watchkeeper is open ' +
    'or recently in the background. Once Android suspends or closes it, the page stops running and ' +
    'no alarm can fire — anything missed is announced the next time you open it. ' +
    'This is a limit of web apps, not a setting. For reminders you cannot miss, use ' +
    '<strong>Send to calendar</strong>, which hands the item to your phone’s calendar and rings independently. ' +
    'Truly reliable background alerts would need a push server (a small always-on backend sending ' +
    'Web Push) or a native Android app. Neither is installed here, and nothing in this app pretends otherwise.';
}
const speakSel = document.getElementById('fSpeak');
speakSel.value = speakEnabled ? 'on' : 'off';
speakSel.addEventListener('change', () => {
  speakEnabled = speakSel.value === 'on';
  try{ localStorage.setItem('watchkeeper.speak', speakEnabled ? 'on' : 'off'); }catch(e){}
  if(!speakEnabled) speaker.cancel();
});
document.getElementById('menuBtn').addEventListener('click', () => { paintStatus(); showSheet(menuSheet); });
document.getElementById('menuClose').addEventListener('click', () => closeSheet(menuSheet));

/* ============================== backup ============================== */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function doBackup(){
  const payload = {app:'watchkeeper', version:2, exported:new Date().toISOString(), items};
  const stamp = new Date().toISOString().slice(0,10);
  downloadBlob(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}),
    'watchkeeper-backup-' + stamp + '.json');
  toast('Backup saved to Downloads');
}
document.getElementById('mBackup').addEventListener('click', doBackup);
document.getElementById('mRestore').addEventListener('click', () => document.getElementById('restoreFile').click());
document.getElementById('restoreFile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let obj = null;
    try{ obj = JSON.parse(fr.result); }
    catch(e){ toast('That file is not valid JSON'); return; }
    const v = validateBackup(obj);
    if(!v.ok && !v.items.length){ toast(v.errors[0] || 'Backup could not be read'); return; }
    /* Merge, never replace: existing reminders are kept. */
    const byId = new Map(items.map(i => [i.id, i]));
    let added = 0, updated = 0;
    v.items.forEach(i => {
      if(byId.has(i.id)){
        const cur = byId.get(i.id);
        items[items.indexOf(cur)] = i; updated++;
      } else { items.push(i); added++; }
    });
    save(); rescheduleAll(); render();
    toast('Restored: ' + added + ' added, ' + updated + ' updated');
  };
  fr.onerror = () => toast('Could not read that file');
  fr.readAsText(f);
});

/* ============================== calendar export ============================== */
function icsStamp(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2,'0');
  return d.getUTCFullYear() + p(d.getUTCMonth()+1) + p(d.getUTCDate()) + 'T' +
         p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + 'Z';
}
function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function fold(line){
  if(line.length <= 73) return line;
  const out = [line.slice(0,73)];
  let rest = line.slice(73);
  while(rest.length > 72){ out.push(' ' + rest.slice(0,72)); rest = rest.slice(72); }
  if(rest) out.push(' ' + rest);
  return out.join('\r\n');
}
function buildICS(list, leadMin){
  const out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Watchkeeper//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const now = Date.now();
  list.forEach(i => {
    if(i.due == null) return;
    out.push('BEGIN:VEVENT');
    out.push('UID:' + i.id + '@watchkeeper');
    out.push('DTSTAMP:' + icsStamp(now));
    /* UTC instants preserve the exact moment. Asia/Colombo and Asia/Singapore
       observe no DST, so a recurring series keeps its local clock time too. */
    out.push('DTSTART:' + icsStamp(i.due));
    out.push('DTEND:' + icsStamp(i.due + 30*60000));
    out.push(fold('SUMMARY:' + icsEsc(KIND_LABEL[i.kind] + ': ' + i.title)));
    const desc = [
      i.vessel ? 'Vessel/company: ' + i.vessel : '',
      i.ref ? 'Ref: ' + i.ref : '',
      i.notes || '',
      i.heard ? 'Captured by voice: "' + i.heard + '"' : '',
      i.tz && i.tz !== 'local' ? 'Fixed to ' + i.tz : '',
      'Exported from Watchkeeper — later edits there will not update this event.'
    ].filter(Boolean).join('\n');
    out.push(fold('DESCRIPTION:' + icsEsc(desc)));
    if(i.priority === 'high') out.push('PRIORITY:1');
    if(i.repeat === 'daily') out.push('RRULE:FREQ=DAILY');
    else if(i.repeat === 'weekly') out.push('RRULE:FREQ=WEEKLY');
    else if(i.repeat === 'weekdays') out.push('RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR');
    else if(i.repeat === 'monthly'){
      const day = i.anchorDay || epochToWall(i.tz, i.due).d;
      out.push(day > 28 ? 'RRULE:FREQ=MONTHLY;BYMONTHDAY=' + day + ',-1;BYSETPOS=1'
                        : 'RRULE:FREQ=MONTHLY;BYMONTHDAY=' + day);
    }
    out.push('BEGIN:VALARM');
    out.push('TRIGGER:' + (leadMin > 0 ? '-PT' + leadMin + 'M' : 'PT0M'));
    out.push('ACTION:DISPLAY');
    out.push(fold('DESCRIPTION:' + icsEsc(i.title)));
    out.push('END:VALARM');
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}
function exportICS(list){
  const withTime = list.filter(i => i.due != null);
  if(!withTime.length){ toast('Nothing with a time to export'); return; }
  const lead = parseInt(document.getElementById('fAlarmLead').value, 10) || 0;
  downloadBlob(new Blob([buildICS(withTime, lead)], {type:'text/calendar;charset=utf-8'}),
    (withTime.length === 1 ? 'reminder' : 'watchkeeper') + '.ics');
  toast(withTime.length === 1
    ? 'Opening in your calendar — it will not follow later edits'
    : withTime.length + ' events sent — they will not follow later edits');
}
document.getElementById('mIcs').addEventListener('click', () => {
  exportICS(items.filter(i => !i.done));
  closeSheet(menuSheet);
});

/* ============================== toast ============================== */
let toastTimer;
const toastEl = document.getElementById('toast');
const toastTextEl = document.getElementById('toastText');
const toastActEl = document.getElementById('toastAct');
let toastFn = null;
function toast(msg, actionLabel, fn){
  toastTextEl.textContent = msg;
  if(actionLabel && fn){ toastActEl.hidden = false; toastActEl.textContent = actionLabel; toastFn = fn; }
  else { toastActEl.hidden = true; toastFn = null; }
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove('on'); toastFn = null; }, actionLabel ? 6000 : 2800);
}
toastActEl.addEventListener('click', () => {
  if(toastFn){ toastFn(); toastFn = null; }
  toastEl.classList.remove('on');
});

/* ============================== boot ============================== */
load();
render();
rescheduleAll();
paintStatusDot();
paintHandsFree();
speaker.setLang(lang);
consumeHashAction();
sweep();
if(handsFree) setTimeout(startHandsFreeListen, 1200);
if(!NATIVE && !window.isSecureContext){
  showBanner('Opened without https — microphone and alerts will not work.', '', null);
}
if(NATIVE && !NATIVE.exactAlarms){
  showBanner('Exact alarms are switched off, so reminders may be late.', 'How to fix', () => {
    paintStatus(); showSheet(menuSheet);
  });
}
